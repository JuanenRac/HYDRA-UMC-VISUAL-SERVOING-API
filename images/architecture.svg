<title id="t">HYDRA-UMC-VISUAL-SERVOING-API architecture</title>
<desc id="d">HYDRA-UMC-VISUAL-SERVOING-API computes a bounded velocity command from a pose error, remembers the loop in a session, and authorises each request against data age, confidence and the safety state under limits fixed at start.</desc>
